name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, e.g. v1.0, v20.15.10

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: HH-Agent.exe
            asset_name: HH-Agent-Windows.exe
          - os: macos-latest
            artifact_name: HH-Agent.dmg
            asset_name: HH-Agent-macOS.dmg

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate macOS icon (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          sips -s format icns icon.png --out icon.icns || echo "Using fallback icon logic"

      - name: Build executable
        run: |
          python build.py

      - name: Package macOS App into DMG (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          npm install -g create-dmg
          create-dmg dist/HH-Agent.app dist/ || echo "Failed to create dmg, falling back to zip"
          if [ -f "dist/HH-Agent.app 1.0.dmg" ]; then
            mv "dist/HH-Agent.app 1.0.dmg" dist/HH-Agent.dmg
          elif [ -f "dist/HH-Agent 1.0.dmg" ]; then
            mv "dist/HH-Agent 1.0.dmg" dist/HH-Agent.dmg
          else
            cd dist && zip -r HH-Agent.dmg HH-Agent.app
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: HH-Agent-Windows.exe
          path: dist_win

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: HH-Agent-macOS.dmg
          path: dist_mac

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_win/HH-Agent.exe
            dist_mac/HH-Agent.dmg
          draft: false
          prerelease: false
