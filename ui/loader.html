<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HH Agent Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden;
        }
        .loader-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 400px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin-top: 0; font-size: 1.2rem; }
        p { color: #666; font-size: 0.9rem; }
        #status-text { font-weight: bold; margin-top: 20px; color: #007bff; word-break: break-word; }
        #status-text.error { color: #b42318; }
        #retry { display: none; margin-top: 18px; padding: 8px 18px; border-radius: 8px;
            border: 1px solid #c9ced6; background: #fff; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner" id="spinner"></div>
        <h2>Первый запуск</h2>
        <p>Настройка окружения и загрузка ядра.<br>Пожалуйста, подождите...</p>
        <div id="status-text">Инициализация...</div>
        <button id="retry" onclick="startInstall()">Повторить</button>
    </div>

    <script>
        function setStatus(text, isError) {
            var el = document.getElementById('status-text');
            el.innerText = text;
            el.className = isError ? 'error' : '';
            document.getElementById('spinner').style.display = isError ? 'none' : '';
            document.getElementById('retry').style.display = isError ? 'inline-block' : 'none';
        }

        // Вызывается из Python по ходу установки.
        window.update_progress = function (msg) { setStatus(msg, false); };
        window.install_failed = function (msg) {
            setStatus('Ошибка: ' + msg + '\nПроверьте интернет и нажмите «Повторить».', true);
        };

        function startInstall() {
            setStatus('Инициализация...', false);
            window.pywebview.api.install_core().catch(function (err) {
                window.install_failed(err);
            });
        }

        window.addEventListener('pywebviewready', startInstall);
    </script>
    <script src="theme.js"></script>
</body>
</html>
